generator:
  output_root: data/debug_compatibility_sweep
  master_seed: 20260401
  overwrite_output: true
  log_level: INFO
  on_variant_failure: skip

dataset:
  length: 480
  channels: 2
  splits: [val]
  instances_per_split: 1

anomaly_policy:
  density_range: [0.05, 0.05]
  density_tolerance: 0.08
  segment_count_range: [1, 1]
  placement_policy: uniform
  channel_policy: single-random
  overlap_policy: global
  length_normalization: resample
  support_label_mode: effective_support
  support_eps_mode: relative
  support_eps_value: 0.05
  min_effective_label_length_non_extremum: 2
  max_placement_attempts: 2500
  skip_density_incompatible_variants: false
  segment_planner:
    default:
      planner: uniform_segments
    mode-correlation:
      planner: mode_boundary_segments
  special_anomaly_policies:
    mode-correlation:
      channel_policy: paired-random
      min_segment_length: 8
    covariance-change:
      channel_policy: paired-random
      min_segment_length: 20
    correlation-flip:
      channel_policy: paired-random
      min_segment_length: 20
    channel-rewiring:
      channel_policy: paired-random
      min_segment_length: 8
    lag-synchronization:
      channel_policy: paired-random
      min_segment_length: 20
    shared-factor-break:
      channel_policy: paired-random
      min_segment_length: 20
  min_segment_length_by_anomaly:
    pattern: 8
    pattern-shift: 8
    mode-correlation: 8
    covariance-change: 20
    correlation-flip: 20
    channel-rewiring: 8
    lag-synchronization: 20
    shared-factor-break: 20

variants:
  base_oscillations:
    - sine
    - cosine
    - square
    - random-walk
    - cylinder-bell-funnel
    - ecg
    - polynomial
    - random-mode-jump
    - sawtooth
    - dirichlet
    - mls
  anomaly_types:
    - amplitude
    - correlation-flip
    - covariance-change
    - channel-rewiring
    - extremum
    - frequency
    - lag-synchronization
    - mean
    - mode-correlation
    - pattern
    - pattern-shift
    - platform
    - shared-factor-break
    - trend
    - variance
  compatibility_mode: hard
  skip_base_oscillations: []
  skip_anomaly_types: []
  disabled_anomaly_types: []
  profiles_per_pair: 1
  pair_profiles: {}
  base_parameter_policy: random_per_instance
  base_channel_parameter_policy: random_per_instance
  anomaly_parameter_policy: fixed_per_variant
  base_channel_correlation:
    shared_noise_weight: 0.75
  base_oscillation_overrides:
    square:
      frequency:
        distribution: uniform
        low: 7.0
        high: 9.0
      amplitude:
        distribution: uniform
        low: 0.9
        high: 1.1
      variance:
        distribution: uniform
        low: 0.08
        high: 0.12
    sawtooth:
      frequency:
        distribution: uniform
        low: 7.0
        high: 9.0
      amplitude:
        distribution: uniform
        low: 0.9
        high: 1.1
      variance:
        distribution: uniform
        low: 0.08
        high: 0.12
    random-mode-jump:
      frequency:
        distribution: int_uniform
        low: 120
        high: 180
      variance:
        distribution: uniform
        low: 0.07
        high: 0.10
      random-seed:
        distribution: int_uniform
        low: 1
        high: 500
  base_channel_overrides:
    square:
      phase:
        distribution: uniform
        low: 0.0
        high: 6.283185307179586
    sawtooth:
      phase:
        distribution: uniform
        low: 0.0
        high: 6.283185307179586
    random-mode-jump:
      channel_diff:
        distribution: uniform
        low: 0.0
        high: 0.0
      channel_offset:
        distribution: uniform
        low: 0.9
        high: 1.1
  anomaly_overrides:
    pattern:
      sinusoid_k: 8.0
      min_effect_delta: 0.12
      min_window_ptp: 0.05
      adaptive_blend: true
      blend_strength: 1.0
      transition_length: 8
    pattern-shift:
      shift_by: 4
      transition_window: 8
      crossfade_mode: cosine
      min_effect_delta: 0.12
    covariance-change:
      coupling_strength: -0.95
      transition_length: 8
    correlation-flip:
      target_correlation: -0.9
      transition_length: 8
    channel-rewiring:
      rotation_degrees: 25
      transition_length: 8
    lag-synchronization:
      lag_steps: 6
      transition_length: 8
    shared-factor-break:
      shared_factor_scale: 0.0
      transition_length: 8

plot:
  enabled: false
  dpi: 120
  zoom_count: 2
  zoom_margin: 36
  zoom_margin_min: 18
  zoom_margin_alpha: 0.6
  zoom_fill_policy: repeat

io:
  csv_float_format: "%.8f"
