generator:
  output_root: data/ts_dataset_generated_frequency_p01_examples
  master_seed: 4242
  overwrite_output: true
  log_level: INFO
  on_variant_failure: skip

dataset:
  length: 10000
  channels: 5
  splits: [test]
  instances_per_split: 2

anomaly_policy:
  density_range: [0.05, 0.10]
  density_tolerance: 0.002
  segment_count_range: [8, 22]
  placement_policy: uniform
  channel_policy: single-random
  overlap_policy: global
  length_normalization: resample
  max_placement_attempts: 2500
  skip_density_incompatible_variants: true
  segment_planner:
    default:
      planner: uniform_segments
  special_anomaly_policies: {}
  min_segment_length_by_anomaly:
    frequency: 24

variants:
  base_oscillations: [sine, cosine, square, sawtooth]
  anomaly_types: [frequency]
  skip_base_oscillations: []
  skip_anomaly_types: []
  disabled_anomaly_types: []
  profiles_per_pair: 1
  pair_profiles:
    sine__frequency: [p01]
    cosine__frequency: [p01]
    square__frequency: [p01]
    sawtooth__frequency: [p01]
  base_parameter_policy: fixed_per_variant
  anomaly_parameter_policy: random_per_segment
  base_oscillation_overrides:
    sine:
      frequency: 5.0
    cosine:
      frequency: 5.0
    square:
      frequency: 5.0
    sawtooth:
      frequency: 5.0
  anomaly_overrides:
    frequency:
      frequency_factor: 1.25
  variant_overrides:
    sine__frequency:
      anomaly_policy: &period_locked_frequency_policy
        segment_count_range: [8, 22]
        segment_planner:
          planner: period_locked_frequency
          periods_per_segment_range: [3, 6]
          align_to_period_start: true
          period_ratio_offsets: [-2, -1, 1, 2]
          frequency_factor_bounds: [0.7, 1.6]
    cosine__frequency:
      anomaly_policy: *period_locked_frequency_policy
    square__frequency:
      anomaly_policy: *period_locked_frequency_policy
    sawtooth__frequency:
      anomaly_policy: *period_locked_frequency_policy

plot:
  enabled: true
  dpi: 140
  zoom_count: 5
  zoom_margin: 100
  zoom_margin_min: 100
  zoom_margin_alpha: 0.0
  zoom_fill_policy: repeat

io:
  csv_float_format: "%.8f"
