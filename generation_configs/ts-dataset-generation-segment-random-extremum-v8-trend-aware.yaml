generator:
  output_root: data/ts_dataset_generated_segment_random_extremum_v8_trend_aware
  master_seed: 4242
  overwrite_output: true
  log_level: INFO
  on_variant_failure: skip

dataset:
  length: 10000
  channels: 5
  splits: [train, val, test]
  instances_per_split: 5

anomaly_policy:
  density_range: [0.05, 0.10]
  density_tolerance: 0.01
  segment_count_range: [20, 50]
  placement_policy: uniform
  channel_policy: single-random
  overlap_policy: global
  length_normalization: resample
  support_label_mode: effective_support
  support_eps_mode: relative
  support_eps_value: 0.03
  max_placement_attempts: 2500
  skip_density_incompatible_variants: true
  segment_planner:
    default:
      planner: uniform_segments
    amplitude:
      planner: energy_aware_segments
      energy_metric: rms
      rms_quantile: 0.55
      weighted_sampling: true
      fallback: error
      adaptive_strength: true
      min_effect_delta: 0.08
      amplitude_factor_bounds: [0.5, 2.0]
      amplitude_factor_deadzone: [0.9, 1.1]
    trend:
      planner: trend_parameter_aware_segments
      segment_count_range: [8, 25]
      min_segment_length: 8
      sine_min_cycles: 0.30
      random_walk_min_segment_length: 8
    extremum:
      planner: point_events_from_density
      density_range: [0.05, 0.10]
      unique_timestamps: true
  special_anomaly_policies: {}
  min_segment_length_by_anomaly:
    amplitude: 5
    pattern: 5
    pattern-shift: 5
    trend: 8

variants:
  base_oscillations: []
  anomaly_types: []
  skip_base_oscillations:
    - custom-input
    - formula
  skip_anomaly_types: []
  disabled_anomaly_types: []
  profiles_per_pair: 1
  pair_profiles:
    cosine__frequency: [p01]
    dirichlet__frequency: [p01]
    ecg__frequency: [p01]
    sawtooth__frequency: [p01]
    sine__frequency: [p01]
    square__frequency: [p01]
  base_parameter_policy: random_per_instance
  base_channel_parameter_policy: random_per_instance
  split_phase_shift:
    enabled: true
    mode: fixed_map
    phase_modulo: 6.283185307179586
    values:
