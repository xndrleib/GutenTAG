generator:
  output_root: data/ts_dataset_v10_longlength_covariance_promotion
  master_seed: 20260415
  overwrite_output: true
  log_level: INFO
  on_variant_failure: skip

dataset:
  length: 10000
  channels: 5
  splits: [train, val, test]
  instances_per_split: 3

anomaly_policy:
  density_range: [0.02, 0.04]
  density_tolerance: 0.04
  segment_count_range: [4, 8]
  placement_policy: uniform
  channel_policy: single-random
  overlap_policy: global
  length_normalization: resample
  support_label_mode: effective_support
  support_eps_mode: relative
  support_eps_value: 0.05
  min_effective_label_length_non_extremum: 2
  max_placement_attempts: 2500
  skip_density_incompatible_variants: true
  special_anomaly_policies:
    covariance-change:
      channel_policy: paired-random
      density_tolerance: 0.04
      min_segment_length: 24
      segment_count_range: [4, 8]
  min_segment_length_by_anomaly:
    covariance-change: 24

variants:
  base_oscillations:
    - polynomial
    - shared-noise-sine
  anomaly_types:
    - covariance-change
  compatibility_mode: validated
  profiles_per_pair: 1
  pair_profiles: {}
  base_parameter_policy: random_per_instance
  base_channel_parameter_policy: random_per_instance
  anomaly_parameter_policy: fixed_per_variant
  split_phase_shift:
    enabled: true
    mode: fixed_map
    phase_modulo: 6.283185307179586
    values:
      train: 0.0
      val: 2.0943951023931953
      test: 4.1887902047863905
  base_channel_correlation:
    shared_noise_weight: 0.94
  base_oscillation_overrides:
    polynomial:
      polynomial:
        - 0.015
        - 0.16
      variance:
        distribution: uniform
        low: 0.09
        high: 0.13
    shared-noise-sine:
      frequency:
        distribution: uniform
        low: 6.0
        high: 8.0
      amplitude:
        distribution: uniform
        low: 0.42
        high: 0.58
      variance:
        distribution: uniform
        low: 0.18
        high: 0.24
  base_channel_overrides:
    shared-noise-sine:
      phase:
        distribution: uniform
        low: 0.0
        high: 6.283185307179586
  anomaly_overrides:
    covariance-change:
      coupling_strength: -0.95
      transition_length:
        distribution: int_uniform
        low: 14
        high: 18
  variant_overrides:
    polynomial__covariance-change:
      base_channel_correlation:
        shared_noise_weight: 0.94
      anomaly:
        transition_length:
          distribution: int_uniform
          low: 14
          high: 18
      anomaly_policy:
        density_range: [0.02, 0.04]
        density_tolerance: 0.04
        segment_count_range: [4, 8]
    shared-noise-sine__covariance-change:
      base_channel_correlation:
        shared_noise_weight: 0.97
      anomaly:
        transition_length:
          distribution: int_uniform
          low: 14
          high: 18
      anomaly_policy:
        density_range: [0.02, 0.04]
        density_tolerance: 0.04
        segment_count_range: [4, 8]

plot:
  enabled: true
  dpi: 140
  zoom_count: 5
  zoom_margin: 100
  zoom_margin_min: 100
  zoom_margin_alpha: 0.0
  zoom_fill_policy: repeat

io:
  csv_float_format: "%.8f"
