name: V13 validation
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v13-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MPLBACKEND: Agg
      BASE_SHA: ${{ github.event.pull_request.base.sha || '97e48a7ad1b8b0431a4998c2ab2036a2e8b5e62f' }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Preserve exact source snapshot
        run: |
          mkdir -p evidence
          git rev-parse HEAD > evidence/checkout-sha.txt
          git archive HEAD -o evidence/source.zip
      - name: Install runtime and testing dependencies
        run: python -m pip install '.[dev]' black==26.5.1 mypy==2.3.1
      - name: Run standalone library suite
        run: python -m pytest tests --ignore=tests/test_dataset_quality_qc_v2.py --ignore=tests/test_split_diversity_check.py --junitxml=evidence/tests.xml
      - name: Compare typing against base, in the same environment
        if: always()
        run: python scripts/check_type_delta.py --base-sha "$BASE_SHA" --output evidence/typecheck
      - name: Check changed Python formatting and lint
        if: always()
        run: |
          python - <<'PY'
          import os, subprocess
          paths = subprocess.check_output(['git','diff','--name-only',os.environ['BASE_SHA'],'HEAD'], text=True).splitlines()
          paths = [p for p in paths if p.endswith('.py') and not p.startswith('tools/')]
          if paths:
              subprocess.run(['python','-m','black','--check',*paths], check=True)
              subprocess.run(['python','-m','flake8',*paths], check=True)
          PY
      - name: Capture environment
        if: always()
        run: python -m pip freeze > evidence/environment.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v13-validation-evidence-${{ matrix.python }}
          path: evidence/
          retention-days: 14
