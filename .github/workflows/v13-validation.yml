name: V13 validation
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v13-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Preserve exact source snapshot
        run: |
          mkdir -p evidence
          git rev-parse HEAD > evidence/checkout-sha.txt
          git archive HEAD -o evidence/source.zip
      - name: Install runtime and testing dependencies
        run: python -m pip install '.[dev]'
      - name: Run standalone library suite
        run: |
          python -m pytest tests --ignore=tests/test_dataset_quality_qc_v2.py --ignore=tests/test_split_diversity_check.py --junitxml=evidence/tests.xml
      - name: Capture environment
        if: always()
        run: python -m pip freeze > evidence/environment.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v13-validation-evidence
          path: evidence/
          retention-days: 7
