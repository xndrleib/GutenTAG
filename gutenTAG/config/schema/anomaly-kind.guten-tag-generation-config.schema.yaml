$schema: https://json-schema.org/draft/2020-12/schema
$id: https://example.com/anomaly-kind.guten-tag-generation-config.schema.yaml
id: anomaly-kind.guten-tag-generation-config.schema.yaml
title: GutenTAG anomaly kind configuration
description: Anomaly kind configuration for a time series.
type: object
required:
  - kind
properties:
  kind:
    type: string
    enum:
      - amplitude
      - correlation-flip
      - covariance-change
      - channel-rewiring
      - extremum
      - frequency
      - lag-synchronization
      - mean
      - pattern
      - pattern-shift
      - platform
      - shared-factor-break
      - trend
      - variance
      - mode-correlation
    description: Kind of the anomaly.
oneOf:
  - $ref: "#/definitions/extremum-params"
  - $ref: "#/definitions/frequency-params"
  - $ref: "#/definitions/mean-params"
  - $ref: "#/definitions/correlation-flip-params"
  - $ref: "#/definitions/covariance-change-params"
  - $ref: "#/definitions/channel-rewiring-params"
  - $ref: "#/definitions/lag-synchronization-params"
  - $ref: "#/definitions/pattern-params"
  - $ref: "#/definitions/pattern-shift-params"
  - $ref: "#/definitions/platform-params"
  - $ref: "#/definitions/shared-factor-break-params"
  - $ref: "#/definitions/variance-params"
  - $ref: "#/definitions/amplitude-params"
  - $ref: "#/definitions/mode-correlation-params"
  - required:
      - kind
      - oscillation
    properties:
      kind:
        const: trend
      oscillation:
        $ref: oscillation.guten-tag-generation-config.schema.yaml
      transition_length:
        type: integer
        description: Boundary-safe blend width used at event edges.
      boundary_mode:
        type: string
        enum: [inside_window_zero_endpoints, legacy_carry_over]
      envelope_kind:
        type: string
        enum: [sine2, sin2, transition]
      min_effect_delta:
        type: number
        description: Minimum absolute pointwise effect enforced inside the event support.
    additionalProperties: false

definitions:
  correlation-flip-params:
    required:
      - kind
    properties:
      kind:
        const: correlation-flip
      target_correlation:
        type: number
        description: Target signed correlation with the anchor channel inside the source window.
      transition_length:
        type: integer
        description: Boundary-safe blend width used at event edges.
    additionalProperties: false
  covariance-change-params:
    required:
      - kind
    properties:
      kind:
        const: covariance-change
      coupling_strength:
        type: number
        description: Signed coupling strength used to mix a channel with its anchor.
      transition_length:
        type: integer
        description: Boundary-safe blend width used at event edges.
    additionalProperties: false
  channel-rewiring-params:
    required:
      - kind
    properties:
      kind:
        const: channel-rewiring
      transition_length:
        type: integer
        description: Boundary-safe blend width used at event edges.
    additionalProperties: false
  extremum-params:
    required:
      - kind
      - min
      - local
    properties:
      kind:
        const: extremum
      min:
        type: boolean
        description: Whether a minimum (true) or a maximum (false) should be generated.
      local:
        type: boolean
        description: Whether a local (true) or a global (false) extremum should be generated.
      context_window:
        type: integer
        description: How many points to the left and right are used to calculate a LOCAL extremum.
    additionalProperties: false
  frequency-params:
    required:
      - kind
      - frequency_factor
    properties:
      kind:
        const: frequency
      frequency_factor:
        type: number
        description: Relative change of frequency.
    additionalProperties: false
  lag-synchronization-params:
    required:
      - kind
      - lag_steps
    properties:
      kind:
        const: lag-synchronization
      lag_steps:
        type: integer
        description: Signed lag applied to the shifted channel inside the source window.
      transition_length:
        type: integer
        description: Boundary-safe blend width used at event edges.
    additionalProperties: false
  mean-params:
    required:
      - kind
      - offset
    properties:
      kind:
        const: mean
      offset:
        type: number
        description: Offset to shift the time series on the y axis within this anomaly region.
      transition_length:
        type: integer
        description: Boundary-safe blend width used at event edges.
      min_effect_delta:
        type: number
        description: Minimum absolute pointwise effect enforced inside the event support.
    additionalProperties: false
  pattern-params:
    required:
      - kind
    properties:
      kind:
        const: pattern
      sinusoid_k:
        type: number
        description: |
          Only used for base oscillations of type 'sine' and 'cosine'.
          Ramming factor for change in sine wave.
      cbf_pattern_factor:
        type: number
        description: |
          Only used for base oscillations of type 'cylinder_bell_funnel'.
          Pattern variance factor for change in CBF wave.
      square_duty:
        type: number
        description: |
          Only used for base oscillation of type 'square'.
          New duty (load factor) of the square wave.
      sawtooth_width:
        type: number
        description: |
          Only used for base oscillations of type 'sawtooth'.
          Sets the new width of the sawtooth wave in this anomaly subsequence.
      min_effect_delta:
        type: number
        description: Minimum absolute pointwise effect enforced inside the event support.
      min_window_ptp:
        type: number
        description: Minimum local peak-to-peak scale used by adaptive pattern templates.
      adaptive_blend:
        type: boolean
        description: Whether to increase blend strength when a sampled pattern is weak.
      blend_strength:
        type: number
        description: Multiplier applied to the pattern-template delta.
      transition_length:
        type: integer
        description: Boundary-safe blend width used at event edges.
    additionalProperties: false
  pattern-shift-params:
    required:
      - kind
      - shift_by
      - transition_window
    properties:
      kind:
        const: pattern-shift
      shift_by:
        type: integer
        description: Size of the shift length to the right. Can be negative for shift to the left.
      transition_window:
        type: integer
        description: Number of points to the left and right used to interpolate a smooth transition.
      crossfade_mode:
        type: string
        enum: [linear, cosine]
        description: Crossfade shape used at event boundaries.
      min_effect_delta:
        type: number
        description: Minimum absolute pointwise effect enforced inside the event support.
    additionalProperties: false
  platform-params:
    required:
      - kind
      - value
    properties:
      kind:
        const: platform
      value:
        type: number
        description: Value of the platform on the y axis.
      transition_length:
        type: integer
        description: Boundary-safe blend width used at event edges.
      min_effect_delta:
        type: number
        description: Minimum absolute pointwise effect enforced inside the event support.
    additionalProperties: false
  shared-factor-break-params:
    required:
      - kind
    properties:
      kind:
        const: shared-factor-break
      shared_factor_scale:
        type: number
        description: Shared-factor attenuation or sign flip relative to the anchor channel.
      transition_length:
        type: integer
        description: Boundary-safe blend width used at event edges.
    additionalProperties: false
  variance-params:
    required:
      - kind
      - variance
    properties:
      kind:
        const: variance
      variance:
        type: number
        description: Value of the new variance.
      transition_length:
        type: integer
        description: Boundary-safe blend width used at event edges.
      min_effect_delta:
        type: number
        description: Minimum absolute pointwise effect enforced inside the event support.
    additionalProperties: false
  amplitude-params:
    required:
      - kind
      - amplitude_factor
    properties:
      kind:
        const: amplitude
      amplitude_factor:
        type: number
        description: Relative change of the amplitude.
      transition_length:
        type: integer
        description: Boundary-safe blend width used at event edges.
      center_mode:
        type: string
        enum: [zero, origin, mean, constant, median, robust, linear, quadratic, poly2]
        description: Local centerline used as the neutral baseline for amplitude scaling.
      min_effect_delta:
        type: number
        description: Minimum absolute pointwise effect enforced inside the event support.
      min_residual_scale:
        type: number
        description: Minimum residual scale needed before amplitude min-effect enforcement is allowed.
    additionalProperties: false
  mode-correlation-params:
    required:
      - kind
    properties:
      kind:
        const: mode-correlation
    additionalProperties: false
